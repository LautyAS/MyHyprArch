# ~/.config/hypr/themes/testtheme2/theme.conf

general {
    gaps_in = 2
    gaps_out = 4
    border_size = 1

    col.active_border = rgba(55aaffee) rgba(99ccffee) 45deg
    col.inactive_border = rgba(444444aa)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 2
    rounding_power = 1

    active_opacity = 0.98
    inactive_opacity = 0.90

    shadow {
        enabled = false
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1
    }
}

animations {
    enabled = yes
}
