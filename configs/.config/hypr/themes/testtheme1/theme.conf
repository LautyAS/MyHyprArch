# ~/.config/hypr/themes/testtheme1/theme.conf

general {
    gaps_in = 10
    gaps_out = 14
    border_size = 3

    col.active_border = rgba(ff5555ee) rgba(ff9999ee) 45deg
    col.inactive_border = rgba(333333aa)

    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    rounding_power = 2

    active_opacity = 0.95
    inactive_opacity = 0.80

    shadow {
        enabled = true
        range = 8
        render_power = 4
        color = rgba(000000ee)
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.2
    }
}

animations {
    enabled = yes
}
